name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate-wrapper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: gradle/actions/wrapper-validation@v5

  build:
    needs: validate-wrapper
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v5
      - name: Build and test
        shell: bash
        run: |
          set -o pipefail
          ./gradlew build --console=plain 2>&1 | tee build.log
      - name: Report failures as annotations
        # Annotations are visible to everyone on the run page, logs only to signed-in users.
        if: failure()
        shell: bash
        run: |
          grep -E -A12 "FAILED|What went wrong|^e: " build.log | head -60 | while IFS= read -r line; do
            echo "::error title=${{ matrix.os }}::${line//%/%25}"
          done
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: test-reports-${{ matrix.os }}
          path: '**/build/reports/tests/'
      - name: Upload client mod
        if: success() && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v5
        with:
          name: dyrox-client
          path: client/build/libs/dyrox-client-*.jar
