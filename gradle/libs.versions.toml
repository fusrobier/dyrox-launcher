[versions]
# Kotlin must match the version fabric-language-kotlin ships at runtime (1.14.1+kotlin.2.4.20).
kotlin = "2.4.20"
compose = "1.12.1"
# Material 3 is versioned separately from Compose Multiplatform; this is what 1.12.1 pairs with.
compose-material3 = "1.9.0"
# Same versions fabric-language-kotlin bundles, so :shared behaves identically in-game.
coroutines = "1.11.0"
serialization = "1.11.0"
junit = "5.14.4"
# Same JNA Minecraft 26.3 ships, so the vault's DPAPI code also works in-game.
jna = "5.17.0"

[libraries]
compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "compose-material3" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-swing = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
jna-platform = { module = "net.java.dev.jna:jna-platform", version.ref = "jna" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
compose = { id = "org.jetbrains.compose", version.ref = "compose" }
